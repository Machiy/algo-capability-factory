[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "algocap-factory"
version = "1.4.4"
description = "基于 AI Agent 的算法能力工厂原型：信用卡违约预测"
readme = "README.md"
requires-python = ">=3.11"
# 依赖统一由 requirements.txt 管理，便于笔试环境一键复现
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["factory*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
# assets/repo 是第三方开源仓库快照（MIT），只做 AST 抽取输入；
# outputs/generated 是运行时由 LLM / 模板生成的代码，已过 AST 静态检查与
# 子进程沙箱验证，不属于手写源码（LLM 代码可能带风格瑕疵，不代表功能问题）。
# 排除后 ruff 只检查自己写的源码、脚本与测试。
exclude = ["assets/repo", "outputs/generated"]
