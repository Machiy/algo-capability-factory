# 全局默认配置；任务级配置见 verify_*.yaml
project:
  name: algocap-factory
  version: 1.4.2
  seed: 42
  log_level: INFO

llm:
  # 默认 mock 保证断网一键复现；真实调用走 DeepSeek 的 OpenAI 兼容接口
  provider: mock                # mock | openai_compat | cassette
  base_url: https://api.deepseek.com   # 也接受 https://api.deepseek.com/v1
  model: deepseek-flash         # 官方当前模型；deepseek-chat / deepseek-reasoner 为旧名
  # 依据官方 Chat Completions / Temperature / Thinking Mode 文档：
  # temperature 0.0 是 Coding/Math 推荐值，但在 thinking 模式下不生效，
  # 因此确定性由 cassette 回放保证，而不是靠 temperature。
  temperature: 0.0
  max_tokens: 8192              # 官方允许 1..393216；thinking 模式默认 64K，此处限预算
  context_budget_tokens: 32000  # 拼 prompt 时 KG 检索结果的输入 token 上限，超出截断
  timeout_seconds: 180          # LLM 请求超时；与 runtime.timeout_seconds（沙箱 60s）互不影响
  reasoning_effort: high        # none | low | high | max；none 禁用 thinking
  thinking: enabled             # enabled | disabled；显式给出时优先于 reasoning_effort
  role_overrides:
    Interpreter: {reasoning_effort: low}   # 结构化抽取不需深度思考，省时省额度
    Coder: {reasoning_effort: high}        # 代码生成保留高强度推理
  # 按角色指定后端：未列出的角色走上面的 provider。
  # Interpreter 走 cassette，让「能力理解」由真实 LLM 录制响应驱动；
  # 其余角色保持规则模板，保证确定性与零外部依赖。
  role_providers:
    Interpreter: cassette
  # 凭据只从环境变量读取（.env 的 LLM_API_KEY），不写入配置文件或 cassette
  api_key_env: LLM_API_KEY

  # 录制回放：真实 API 响应脱敏后入库，供无 key 环境复现同一输出
  cassette:
    dir: assets/llm_cassettes
    version: 1
    record: false               # openai_compat 下置 true 时录制真实调用
    # 未命中时显式回退规则模板，回退结果的 source 标为 mock 并记录 warning，
    # 不冒充真实调用；置 error 可改为严格失败。
    on_miss: fallback_mock
    # 命中键必须包含所有影响输出的参数，否则不同思考强度下会错配回放
    key_fields: [role, system, user, model, temperature, max_tokens, reasoning_effort, thinking]
    strip: [authorization, api_key, base_url, cookies, set-cookie]
    # 落盘：request 正文、response 原始文本与解析结果、usage、model、时间戳
    # 禁止落盘：任何 header、完整 endpoint、key/token（仅保留 provider 名）

knowledge:
  # 图谱等产物路径不再单独配置：统一由 factory/artifacts.py 按场景推导
  # <scope>_kg[_<variant>].<ext>，杜绝「配置写一份、代码拼一份」的两个命名来源
  # 跨场景共享材料：工程教训库是系统层面的知识，换任务（文本 / 回归）也必须继续生效
  shared_docs:
    - assets/docs/engineering_lessons.md
  retrieval:
    top_k: 5
    weights:
      constraint_match: 0.40
      historical_metric: 0.30
      evidence_freshness: 0.15
      failure_penalty: 0.15
  # 知识沉淀口径：同一错误签名在 >= 该数量的独立 run 中出现，才提升为教训。
  # ValidationRun 属于运行日志（可丢弃），Lesson 才是跨运行可复用的知识。
  lesson_promote_threshold: 2
  lesson_prompt_limit: 5

workflow:
  beam_width: 3
  max_repair_rounds: 3
  # 同一候选重复 fit 次数：>=2 才产出确定性证据（repeat_variance）
  determinism_repeat: 2
  # 候选比较结束后对最佳候选跑一次 test 终评；只进报告，不参与排序与修复
  evaluate_on_test: true
  roles:
    - Interpreter
    - Retriever
    - Planner
    - Coder
    - Reviewer
    - Verifier
    - Repairer
    - Curator

# 入口输入引导：用户描述不清楚时先追问/给示例，不把「瞎说」带进七步闭环。
# 判定全部是字符串匹配，不调用 LLM，断网可复现；场景级关键词与示例在 verify_*.yaml。
intake:
  min_chars: 8                  # 低于此长度直接判不可执行
  max_examples: 3               # 提示里最多给几条可复制示例
  off_topic_patterns:           # 命中且完全不沾当前场景 → 直接拦下
    - 写诗
    - 作诗
    - 写一首
    - 一首诗
    - 写小说
    - 写作文
    - 讲笑话
    - 讲个笑话
    - 天气预报
    - 订机票
    - 写周报
    - 菜谱
  off_topic_message: 这条描述看起来不是算法能力需求
  # 一条可执行的描述至少要表达「目标 + 数据」；指标与约束缺了只提示不拦
  elements:
    - key: goal
      label: 任务目标
      required: true
      keywords: [预测, 分类, 回归, 识别, 判别, 打分, 评分, 估计, 复刻, 违约, 流失,
                欺诈, 垃圾短信, 需求, 预测值, predict, classify, forecast, score]
      hint: 要解决什么问题（预测 / 分类 / 回归 / 复刻已有能力）
    - key: data
      label: 输入数据
      required: true
      keywords: [数据, 客户, 样本, 特征, 短信, 文本, 交易, 账单, 语料, 表格, 工单,
                数据集, dataset, feature, text]
      hint: 用哪份数据、以什么字段作为输入
    - key: metric
      label: 评价指标
      keywords: [指标, auc, ks, f1, pr_auc, rmse, mae, r2, 准确率, 召回, 精确, 宏平均,
                成本加权, accuracy, recall, precision]
      hint: 主指标与业务门槛（如 AUC ≥ 0.78、RMSE 最小）
    - key: constraint
      label: 业务约束
      keywords: [约束, 划分, 时间外, 成本比, 阈值, 禁止, 合规, 敏感, 公平, 可解释,
                不泄漏, 入模, 洗牌, split, temporal, cost, threshold, leakage]
      hint: 划分方式、成本比、禁入模字段、可解释性等硬约束
  questions:
    goal: 这条能力要输出什么？例如「预测客户是否会在下月违约」
    data: 用哪份数据、哪些字段作为输入？
    metric: 主指标与业务门槛是什么？例如「AUC 不低于 0.78」
    constraint: 有哪些硬约束？例如「时间外划分、成本比 5:1、禁止 ID 入模」
  examples:
    - 预测信用卡客户下月违约概率，时间外划分，按 5:1 成本比选阈值，禁止 ID 入模。
    - 把短信分类为垃圾短信或正常短信，输出准确率与宏平均 F1。

runtime:
  timeout_seconds: 60
  memory_limit_mb: 2048
  allowed_imports:
    - numpy
    - pandas
    - sklearn
    - imblearn
    - math
    - typing
    - dataclasses
  forbidden_patterns:
    - os.system
    - subprocess
    - socket
    - requests
    - open

paths:
  data: assets/data/UCI_Credit_Card.csv
  docs: assets/docs
  legacy: assets/legacy
  generated: outputs/generated
  reports: outputs/reports
  kg: outputs/kg
  runs: outputs/runs
