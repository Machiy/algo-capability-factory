# 第二任务类型：回归，对应进阶要求「支持不同任务类型的验证配置」
# 主线 P2/P5 用 sklearn 内置或合成回归数据跑一次最小 smoke，证明不改核心验证器即可切换配置；
# 下方 path 指向的完整 Bike Sharing 数据包属 P6 可选扩展，故 status 仍为 planned。
status: planned
task_type: tabular_regression
capability_id: cap.regression.demand.v1

dataset:
  path: assets/data/bike_sharing_hour.csv
  source: UCI Bike Sharing Dataset (CC BY 4.0)
  # 备选：sklearn.datasets.fetch_california_housing（首次需联网）
  target: cnt
  expected_columns: [season, yr, mnth, hr, holiday, weekday, workingday,
                     weathersit, temp, atemp, hum, windspeed, casual, registered, cnt]

split:
  strategy: time_series_split
  n_splits: 5
  shuffle: false

constraints:
  non_negative_prediction: true
  no_future_features: true

metrics:
  - {name: rmse, direction: minimize, threshold: null, plugin: sklearn_metrics}
  - {name: mae, direction: minimize, threshold: null, plugin: sklearn_metrics}
  - {name: r2, direction: maximize, threshold: 0.60, plugin: sklearn_metrics}

baselines:
  - dummy_mean
