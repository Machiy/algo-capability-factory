# 第二任务类型：回归，对应进阶要求「支持不同任务类型的验证配置」
# 与信用卡场景共用同一套验证器 / 沙箱 / 工作流：差异只在本文件与算法模板。
# 主指标是 rmse（direction: minimize），报告与候选排序据此处理方向。
status: active
task_type: tabular_regression
capability_id: cap.regression.demand.v1

dataset:
  path: assets/data/synthetic_demand.csv
  # 合成数据，非真实业务数据，仅用于验证回归任务的四层链路
  source: sklearn.datasets.make_regression(n_samples=3000, n_features=8, noise=20, random_state=42)
  target: demand
  id_column: ""
  forbidden_features:
    - demand
  expected_rows: 3000

split:
  strategy: temporal_holdout
  train_ratio: 0.60
  valid_ratio: 0.20
  test_ratio: 0.20
  random_state: 42
  test_used_once: true

constraints:
  deterministic: true          # 所有模板固定 random_state，重复运行结果一致
  test_used_once: true

metrics:
  - {name: rmse, direction: minimize, threshold: null, plugin: sklearn_metrics}
  - {name: mae, direction: minimize, threshold: null, plugin: sklearn_metrics}
  - {name: r2, direction: maximize, threshold: 0.80, plugin: sklearn_metrics}

candidates:
  model_families: [hist_gradient_boosting_regressor, ridge, random_forest_regressor]

baselines:
  - dummy_mean
